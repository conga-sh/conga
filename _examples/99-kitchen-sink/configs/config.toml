# Kitchen Sink - TOML Format
# This file demonstrates every supported type and configuration pattern

# Root flags (top-level keys)
verbosity = 2
format = "yaml"
cache = false
api_secret = "remapped-secret"

# Feature toggles (root Features container -> [features] section)
[features]
http3 = true
compression = 2

# Primitives subcommand
[types.primitives]
string-flag = "toml-configured"
bool-flag = true
int-flag = 100
int8-flag = 8
int16-flag = 160
int32-flag = 3200
int64-flag = 64000
uint-flag = 200
uint8-flag = 80
uint16-flag = 1600
uint32-flag = 32000
uint64-flag = 64000
float32-flag = 1.5
float64-flag = 3.14159265359
tags = ["toml", "prod", "monitored"]
ports = [8080, 8443, 9090]

# Filesystem subcommand
[types.filesystem]
input-file = "/etc/hosts"
output-dir = "/tmp"
log-file = "/var/log/demo.log"
data-dir = "/var/lib/demo"
editor = "sh"
# Hook must be an existing symlink; the test suite creates deploy-hook -> run.sh
hook = "deploy-hook"

# Value subcommand
[types.values]
timeout = "1m30s"
endpoint = "https://api.example.com/v2"
max-size = "50MB"
level = "warn"

shard-map = { web = "3", worker = "5" }

# Config subcommand (shared context flag)
[config]
context = "production"

# Config maps subcommand: native map vs array-of-strings encodings
[config.maps]
vars = { LOG_LEVEL = "debug", APP_ENV = "production", DB_HOST = "localhost" }
labels = ["tier=frontend", "team=platform", "version=2.1"]

# Config nested subcommand (deep nesting)
[config.nested]
zone = "eu-west-1a"
count = 5
