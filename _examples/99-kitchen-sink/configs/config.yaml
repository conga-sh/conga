# Kitchen Sink - YAML Format
# This file demonstrates every supported type and configuration pattern

# Root flags (top-level keys)
verbosity: 3
format: toml
cache: false
api_secret: yaml-secret-key-def456

# Feature toggles (root Features container -> features section)
features:
  http3: true
  compression: 2

# Primitives subcommand
types:
  primitives:
    string-flag: yaml-configured
    bool-flag: true
    int-flag: 102
    int8-flag: 10
    int16-flag: 162
    int32-flag: 3202
    int64-flag: 64002
    uint-flag: 202
    uint8-flag: 82
    uint16-flag: 1602
    uint32-flag: 32002
    uint64-flag: 64002
    float32-flag: 1.7
    float64-flag: 2.95
    tags: ["yaml", "prod", "monitored"]
    ports: [8082, 8445, 9092]

  # Filesystem subcommand
  filesystem:
    input-file: /etc/hosts
    output-dir: /tmp
    log-file: /var/log/demo.log
    data-dir: /var/lib/demo
    editor: sh
    hook: deploy-hook # created by the test suite (symlink)

  # Value subcommand
  values:
    timeout: 90s
    endpoint: https://yaml.example.com/v2
    max-size: 70MB
    level: debug
    shard-map:
      web: "1"
      worker: "6"

# Config subcommand (shared context flag)
config:
  context: development

  # Config maps subcommand: native map vs array-of-strings encodings
  maps:
    vars:
      LOG_LEVEL: warn
      APP_ENV: staging
      DB_HOST: yaml-db.local
    labels:
      - tier=worker
      - team=sre

  # Config nested subcommand (deep nesting)
  nested:
    zone: eu-central-1c
    count: 9
